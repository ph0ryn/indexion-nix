name: Update indexion

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        run: |
          curl --fail --location https://nixos.org/nix/install | sh -s -- --no-daemon
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.config/nix"
          echo "experimental-features = nix-command flakes" >> "$HOME/.config/nix/nix.conf"
      - name: Update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./update-release
      - name: Verify
        run: |
          nix flake check --no-build
          nix build --no-link .#packages.x86_64-linux.default
      - name: Commit update
        run: |
          git diff --quiet || {
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package.nix
            git commit -m "chore: update indexion to v$(sed -nE 's/^  version = "([^"]+)";/\1/p' package.nix)"
            git push
          }
